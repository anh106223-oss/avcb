<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn Luyện KET Listening - Chia Theo Part</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-soft: #eff6ff;
      --secondary: #0f172a;
      --accent: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --correct: #15803d;
      --correct-bg: #dcfce7;
      --wrong: #b91c1c;
      --wrong-bg: #fee2e2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px 12px; line-height: 1.5; }
    .container { max-width: 900px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 25px; }
    header h1 { font-size: 1.75rem; color: var(--primary); margin-bottom: 6px; }
    header p { color: #64748b; font-size: 0.95rem; }

    /* Part Navigation Tabs */
    .part-tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .part-btn {
      background: #e2e8f0;
      color: #334155;
      border: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .part-btn:hover { background: #cbd5e1; }
    .part-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(29, 78, 216, 0.25);
    }

    /* Sub-tabs (Packages) */
    .sub-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .sub-bar-title { font-size: 0.9rem; font-weight: 600; color: #64748b; margin-right: 6px; }
    .pkg-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #475569;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .pkg-btn:hover { background: #e2e8f0; }
    .pkg-btn.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #ffffff;
    }

    /* Question Card */
    .quiz-card {
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 25px;
    }
    .quiz-header {
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 12px;
      margin-bottom: 18px;
    }
    .quiz-header h2 { font-size: 1.3rem; color: #0f172a; margin-bottom: 4px; }
    .quiz-header p { font-size: 0.9rem; color: #64748b; font-style: italic; }

    .q-item {
      padding: 14px 0;
      border-bottom: 1px dashed var(--border);
    }
    .q-item:last-child { border-bottom: none; }
    .q-title { font-weight: 600; margin-bottom: 8px; font-size: 1rem; }

    /* Choices */
    .options { display: flex; flex-direction: column; gap: 8px; margin-left: 8px; }
    .tf-options { display: flex; gap: 24px; margin-left: 8px; }
    .opt-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.95rem; }
    .opt-label input { cursor: pointer; accent-color: var(--primary); width: 17px; height: 17px; }

    /* Fill Form Style */
    .fill-box {
      background: var(--primary-soft);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      padding: 16px;
      margin-top: 10px;
    }
    .fill-box h3 { font-size: 1.05rem; color: var(--primary); margin-bottom: 10px; text-transform: uppercase; }
    .fill-meta { color: #475569; font-weight: 600; font-size: 0.9rem; margin-bottom: 12px; }
    .fill-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }
    .fill-input {
      padding: 7px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      min-width: 170px;
      background: #ffffff;
      transition: 0.2s;
    }
    .fill-input:focus { border-color: var(--primary); }

    /* Feedback badges */
    .feedback { margin-left: 10px; font-size: 0.85rem; font-weight: 600; }
    .badge-correct { color: var(--correct); background: var(--correct-bg); padding: 3px 8px; border-radius: 4px; }
    .badge-wrong { color: var(--wrong); background: var(--wrong-bg); padding: 3px 8px; border-radius: 4px; }

    /* Action buttons */
    .actions { display: flex; justify-content: center; gap: 14px; margin: 25px 0; }
    .btn {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-submit { background: var(--primary); color: #fff; }
    .btn-submit:hover { background: #1e40af; }
    .btn-reset { background: #64748b; color: #fff; }
    .btn-reset:hover { background: #475569; }

    /* Score banner */
    .score-banner {
      display: none;
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      color: #1e3a8a;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 20px;
    }
  </style>
</head>

          { id: "f1", label: "The “early morning swim” starts at:", suffix: "a.m.", ans: ["6.00", "6", "six", "6:00", "six o'clock", "6 o'clock"] },
          { id: "f2", label: "9.30-12.30, pool is used by:", ans: ["school children", "schools", "school", "students", "the schools", "children"] },
          { id: "f3", label: "Each lesson costs: £", ans: ["7.50", "7.5", "seven pounds fifty", "seven pounds and fifty pence"] },
          { id: "f4", label: "Date of next course:", ans: ["9 march", "9th march", "9th of march", "9.3", "march 9"] },
          { id: "f5", label: "Teacher’s name: Roy", ans: ["fowler"] }
        ]
      },
      8: {
        title: "Homework",
        info: "Subject: Biology",
        fields: [
          { id: "f1", label: "Name of book:", ans: ["river", "rivers", "the river", "the rivers"] },
          { id: "f2", label: "Written by: Martin", ans: ["cooper"] },
          { id: "f3", label: "Read: pages", ans: ["123-127", "123 - 127", "123 to 127"] },
          { id: "f4", label: "Learn about:", ans: ["fish"] },
          { id: "f5", label: "Finish by:", ans: ["friday"] }
        ]
      }
    }
  }
};

let currentPart = 1;
let currentPkg = 1;

function selectPart(partNum) {
  currentPart = partNum;
  currentPkg = 1; // reset về đề 1 của part đó
  document.querySelectorAll(".part-btn").forEach((btn, idx) => {
    btn.classList.toggle("active", idx + 1 === partNum);
  });
  renderPackageButtons();
  renderQuiz();
}

function selectPackage(pkgNum) {
  currentPkg = pkgNum;
  document.querySelectorAll(".pkg-btn").forEach(btn => {
    btn.classList.toggle("active", parseInt(btn.dataset.pkg) === pkgNum);
  });
  renderQuiz();
}

function renderPackageButtons() {
  const container = document.getElementById("pkgButtonList");
  container.innerHTML = "";
  const partData = db[`part${currentPart}`];
  const pkgKeys = Object.keys(partData.packages);

  pkgKeys.forEach(k => {
    const pkgNum = parseInt(k);
    const btn = document.createElement("button");
    btn.className = `pkg-btn ${pkgNum === currentPkg ? 'active' : ''}`;
    btn.dataset.pkg = pkgNum;
    btn.innerText = `Package ${pkgNum}`;
    btn.onclick = () => selectPackage(pkgNum);
    container.appendChild(btn);
  });
}

function renderQuiz() {
  const container = document.getElementById("quizContainer");
  const banner = document.getElementById("scoreBanner");
  banner.style.display = "none";

  const partInfo = db[`part${currentPart}`];
  const pkgContent = partInfo.packages[currentPkg];

  let html = `
    <div class="quiz-card">
      <div class="quiz-header">
        <h2>${partInfo.name} - Package ${currentPkg}</h2>
        <p>${partInfo.desc}</p>
      </div>
  `;

  if (currentPart === 1) {
    pkgContent.forEach((item, idx) => {
      html += `
        <div class="q-item" id="item_${idx}">
          <div class="q-title">${item.q} <span class="feedback"></span></div>
          <div class="options">
            ${item.opts.map(opt => `
              <label class="opt-label">
                <input type="radio" name="ans_${idx}" value="${opt[0]}"> ${opt}
              </label>
            `).join('')}
          </div>
        </div>
      `;
    });
  } else if (currentPart === 2) {
    pkgContent.forEach((item, idx) => {
      html += `
        <div class="q-item" id="item_${idx}">
          <div class="q-title">${item.q} <span class="feedback"></span></div>
          <div class="tf-options">
            <label class="opt-label"><input type="radio" name="ans_${idx}" value="T"> True (T)</label>
            <label class="opt-label"><input type="radio" name="ans_${idx}" value="F"> False (F)</label>
          </div>
        </div>
      `;
    });
  } else if (currentPart === 3) {
    html += `<p style="font-weight:600; color:#3b82f6; margin-bottom:14px;">🎧 Ngữ cảnh: ${pkgContent.topic}</p>`;
    pkgContent.items.forEach((item, idx) => {
      html += `
        <div class="q-item" id="item_${idx}">
          <div class="q-title">${item.q} <span class="feedback"></span></div>
          <div class="options">
            ${item.opts.map(opt => `
              <label class="opt-label">
                <input type="radio" name="ans_${idx}" value="${opt[0]}"> ${opt}
              </label>
            `).join('')}
          </div>
        </div>
      `;
    });
  } else if (currentPart === 4) {
    html += `
      <div class="fill-box">
        <h3>${pkgContent.title}</h3>
        ${pkgContent.info ? `<div class="fill-meta">${pkgContent.info}</div>` : ''}
    `;
    pkgContent.fields.forEach((field, idx) => {
      html += `
        <div class="fill-row" id="item_${idx}">
          <span>(${16 + idx}) ${field.label}</span>
          <input type="text" class="fill-input" id="field_${idx}" placeholder="Gõ câu trả lời..." autocomplete="off">
          ${field.suffix ? `<span>${field.suffix}</span>` : ''}
          <span class="feedback"></span>
        </div>
      `;
    });
    html += `</div>`;
  }

  html += `</div>`;
  container.innerHTML = html;
}

function gradeCurrentTest() {
  const partInfo = db[`part${currentPart}`];
  const pkgContent = partInfo.packages[currentPkg];
  let score = 0;
  let total = 5;

  if (currentPart === 1 || currentPart === 2) {
    pkgContent.forEach((item, idx) => {
      const selected = document.querySelector(`input[name="ans_${idx}"]:checked`);
      const row = document.getElementById(`item_${idx}`);
      const fb = row.querySelector(".feedback");

      if (selected && selected.value === item.ans) {
        score++;
        fb.innerHTML = `<span class="badge-correct">✓ Đúng</span>`;
      } else {
        fb.innerHTML = `<span class="badge-wrong">✗ Sai (Đáp án: ${item.ans})</span>`;
      }
    });
  } else if (currentPart === 3) {
    pkgContent.items.forEach((item, idx) => {
      const selected = document.querySelector(`input[name="ans_${idx}"]:checked`);
      const row = document.getElementById(`item_${idx}`);
      const fb = row.querySelector(".feedback");

      if (selected && selected.value === item.ans) {
        score++;
        fb.innerHTML = `<span class="badge-correct">✓ Đúng</span>`;
      } else {
        fb.innerHTML = `<span class="badge-wrong">✗ Sai (Đáp án: ${item.ans})</span>`;
      }
    });
  } else if (currentPart === 4) {
    pkgContent.fields.forEach((field, idx) => {
      const input = document.getElementById(`field_${idx}`);
      const row = document.getElementById(`item_${idx}`);
      const fb = row.querySelector(".feedback");
      const val = input.value.trim().toLowerCase();

      const isMatch = field.ans.some(a => a.toLowerCase() === val);
      if (isMatch) {
        score++;
        input.style.borderColor = "var(--correct)";
        fb.innerHTML = `<span class="badge-correct">✓ Đúng</span>`;
      } else {
        input.style.borderColor = "var(--wrong)";
        fb.innerHTML = `<span class="badge-wrong">✗ Sai (Đáp án: ${field.ans[0]})</span>`;
      }
    });
  }

  const banner = document.getElementById("scoreBanner");
  banner.innerHTML = `Kết quả: ${score} / ${total} câu đúng (${Math.round((score/total)*100)}%)`;
  banner.style.display = "block";
  banner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function resetCurrentTest() {
  renderQuiz();
}

// Khởi chạy
window.onload = () => {
  renderPackageButtons();
  renderQuiz();
};
</script>
</body>
</html>
